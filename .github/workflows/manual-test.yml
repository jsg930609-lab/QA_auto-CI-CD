name: Manual QA Test

on:
  workflow_dispatch:
    inputs:
      test_environment:
        description: '테스트 환경'
        required: true
        type: choice
        options:
          - production
          - staging
          - development
      test_suite:
        description: '테스트 스위트'
        required: false
        type: string
        default: 'all'
      browser:
        description: '브라우저'
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  manual-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browser
      run: |
        playwright install ${{ github.event.inputs.browser }}
        playwright install-deps
    
    - name: Setup credentials
      run: |
        echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        cat > .env << EOF
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL=gpt-4o
        GOOGLE_DRIVE_FILE_ID=${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        PLAYWRIGHT_BROWSER=${{ github.event.inputs.browser }}
        TEST_ENVIRONMENT=${{ github.event.inputs.test_environment }}
        EOF
    
    - name: Run tests
      run: python main.py
    
    - name: Upload results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: manual-test-${{ github.event.inputs.test_environment }}
        path: |
          reports/
          screenshots/